name: Test

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install build tooling
        run: python -m pip install --upgrade build
      - name: Compile application modules
        run: >-
          PYTHONDONTWRITEBYTECODE=1 python -c
          "from pathlib import Path; [compile(p.read_text(), str(p), 'exec') for p in Path('app').glob('*.py')]"
      - name: Run regression suite
        run: PYTHONPATH=app PYTHONDONTWRITEBYTECODE=1 python -m unittest discover -s tests -v
      - name: Build wheel
        run: python -m build
      - name: Verify packaged deployment assets
        run: python tests/verify_wheel.py dist/*.whl
